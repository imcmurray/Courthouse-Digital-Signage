<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Courthouse Digital Signage</title>
  <link rel="stylesheet" href="css/display.css">
</head>
<body>
  <!-- Header Section -->
  <header class="header">
    <div class="header-content">
      <div class="court-branding">
        <img src="assets/court-seal.svg" alt="Court Seal" class="court-seal" id="court-seal">
        <div class="court-name">
          <h1 id="court-title">U.S. Bankruptcy Court</h1>
          <h2><span id="court-subtitle">District of Utah</span><span id="courthouse-sep" class="courthouse-sep"></span><span id="courthouse-name"></span></h2>
          <h3 id="court-officials"></h3>
        </div>
      </div>
      <div class="info-widget" id="info-widget">
        <div class="location" id="location">Salt Lake City</div>
        <div class="weather" id="weather">
          <img class="weather-icon" src="assets/weather/default.svg" alt="Weather">
          <span class="temperature">--</span>
          <span class="temp-range">
            <span class="temp-high">H: --</span>
            <span class="temp-low">L: --</span>
          </span>
        </div>
        <div class="datetime">
          <div class="time" id="time">--:--</div>
          <div class="day" id="day">---</div>
          <div class="date" id="date">---</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Template-driven main content area -->
  <main id="template-content"></main>

  <!-- Legend Bar: pagination info (left) + Zoom connection details (right) -->
  <div id="zoom-legend">
    <div class="legend-bar-left" id="pagination-info"></div>
    <div class="legend-bar-right" id="zoom-legend-content"></div>
  </div>

  <!-- Bottom Bar: Notice Banner + Announcement Ticker -->
  <footer class="bottom-bar">
    <div class="notice-banner" id="notice-banner">
      <span class="notice-icon">&#9888;</span>
      <span class="notice-text" id="notice-text">Please turn your phones OFF in the Courthouse</span>
    </div>
    <div class="ticker-container" id="ticker-container">
      <div class="ticker-content" id="ticker-content">
        <!-- Announcements will scroll here -->
        <span class="ticker-text">Welcome to the U.S. Bankruptcy Court</span>
      </div>
    </div>
  </footer>

  <!-- Offline Indicator -->
  <div class="offline-indicator" id="offline-indicator" style="display: none;">
    <span>OFFLINE - Last updated: <span id="last-updated">--:--</span></span>
  </div>

  <!-- Emergency Overlay -->
  <div id="emergency-overlay" class="emergency-overlay" style="display: none;"></div>

  <!-- Screensaver Overlay -->
  <div id="screensaver-overlay" class="screensaver-overlay" style="display: none;">
    <div id="screensaver-content" class="screensaver-content"></div>
  </div>

  <!-- HLS.js for camera feeds (IT Status display type). Self-hosted (not CDN) so
       displays boot on a restricted/offline courthouse network. Update: hls.js@1.5.17 -->
  <script src="js/vendor/hls.min.js"></script>

  <!-- Socket.io client for real-time updates. Self-hosted, v4.8.1 to match the
       server's socket.io version. Update: socket.io-client@4.8.1 -->
  <script src="js/vendor/socket.io.min.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
