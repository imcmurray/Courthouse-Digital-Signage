# Production deployment for Dockge
# Pre-built images from ghcr.io — no build context needed.
# Set JWT_SECRET before starting (generate with: openssl rand -base64 32)

services:
  backend:
    image: ghcr.io/imcmurray/courthouse-digital-signage-backend:latest
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-30m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NWS_USER_AGENT=${NWS_USER_AGENT:-}
    volumes:
      - db-data:/app/data
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: ghcr.io/imcmurray/courthouse-digital-signage-nginx:latest
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - uploads-data:/app/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:
