                  message:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportLog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Import already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar-import/history:
    get:
      tags: [Calendar Import]
      summary: Get import history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated import history
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportLog'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar-import/history/{id}:
    get:
      tags: [Calendar Import]
      summary: Get details of a specific import run
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportLog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Import not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar-import/config:
    get:
      tags: [Calendar Import]
      summary: Get calendar import configuration
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Import configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  intervalMinutes:
                    type: integer
                  sourceUrl:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Calendar Import]
      summary: Update calendar import configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                intervalMinutes:
                  type: integer
                sourceUrl:
                  type: string
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── System ────────────────────────────────────────
  /api/export:
    get:
      tags: [System]
      summary: Export all data as JSON (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON data export
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      docketEntries:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocketEntry'
                      displays:
                        type: array
                        items:
                          $ref: '#/components/schemas/Display'
                      announcements:
                        type: array
                        items:
                          $ref: '#/components/schemas/Announcement'
                      displayAnnouncements:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnnouncementDisplay'
                      settings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Setting'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/clear:
    delete:
      tags: [System]
      summary: Clear all data except users (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  cleared:
                    type: object
                    properties:
                      docketEntries:
                        type: integer
                      announcements:
                        type: integer
                      displayAnnouncements:
                        type: integer
                      auditLogs:
                        type: integer
                      displayDocketEntries:
                        type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/import:
    post:
      tags: [System]
      summary: Import data from JSON export (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Data object matching export format
      responses:
        '200':
          description: Data imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  imported:
                    type: object
        '400':
          description: Invalid import data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Idle Content Cards ───────────────────────────
  /api/idle-content-cards:
    get:
      tags: [Idle Content Cards]
      summary: List all idle content cards
      description: Returns all idle content cards with their display assignments and creator info.
      security:
        - bearerAuth: []
      parameters:
        - name: enabled
          in: query
          schema:
            type: string
            enum: ['true']
          description: When "true", only return enabled cards
      responses:
        '200':
          description: List of idle content cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdleContentCard'
                  total:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Idle Content Cards]
      summary: Create an info card
      description: |
        Creates a new idle content card of type "info". System card types
        (upcoming_hearings, statistics) cannot be created manually.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdleContentCardRequest'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdleContentCard'
        '400':
          description: Missing required fields or attempted to create system card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/idle-content-cards/reorder:
    patch:
      tags: [Idle Content Cards]
      summary: Bulk reorder idle content cards
      description: |
        Updates the sortOrder of multiple cards at once. All updates are
        applied in a transaction. Emits an idle-content:update WebSocket event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      sortOrder:
                        type: integer
                    required: [id, sortOrder]
              required: [order]
      responses:
        '200':
          description: Cards reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  updated:
                    type: integer
        '400':
          description: Invalid input (empty array or missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/idle-content-cards/{id}:
    put:
      tags: [Idle Content Cards]
      summary: Update an idle content card
      description: |
        Updates a card. System cards (type != "info") only accept enabled,
        sortOrder, and displayIds changes. Info cards accept all fields.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIdleContentCardRequest'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdleContentCard'
        '400':
          description: Validation error (empty title or body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Idle Content Cards]
      summary: Delete an info card
      description: Deletes a user-created info card. System cards cannot be deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Card deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required, or system card cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── News ─────────────────────────────────────────
  /api/news:
    get:
      tags: [News]
      summary: List cached news articles
      description: Returns paginated news articles ordered by fetch date (newest first).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated news articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/NewsArticle'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  totalPages:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/news/scrape:
    post:
      tags: [News]
      summary: Trigger a manual news scrape
      description: Runs the news scraper to fetch and cache new articles from the court website.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scrape completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  articlesAdded:
                    type: integer
                  articlesUpdated:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Scrape failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/news/{id}:
    delete:
      tags: [News]
      summary: Delete a cached news article
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Article deleted
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Article not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Display Templates ───────────────────────────
  /api/display-templates:
    get:
      tags: [Display Templates]
      summary: List all display templates with usage counts
      description: Returns templates ordered by built-in status (built-in first), then by name.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of display templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisplayTemplate'
                  total:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Display Templates]
      summary: Create a custom display template (admin only)
      description: |
        Creates a new custom display template. The slug must be globally unique and
        contain only lowercase letters, numbers, and hyphens. Components are validated
        against allowed component types.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisplayTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayTemplate'
        '400':
          description: Missing required fields, invalid slug format, or invalid components
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Template with this slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/display-templates/{id}:
    get:
      tags: [Display Templates]
      summary: Get a single display template
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayTemplate'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Display Templates]
      summary: Update a display template (admin only)
      description: |
        Updates an existing template. Built-in templates cannot have their slug changed.
        Components are validated against allowed component types.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisplayTemplateRequest'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayTemplate'
        '400':
          description: Cannot change slug of built-in template, or invalid components
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Template with this slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Display Templates]
      summary: Delete a custom display template (admin only)
      description: Deletes a custom template. Built-in templates and templates in use by displays cannot be deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Cannot delete built-in template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot delete template in use by displays
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  displays:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string

  /api/display-templates/{id}/reset:
    post:
      tags: [Display Templates]
      summary: Reset a built-in template to defaults (admin only)
      description: Resets a built-in template's name, description, components, and layout to factory defaults. Only works on built-in templates.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template reset to defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayTemplate'
        '400':
          description: Can only reset built-in templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
