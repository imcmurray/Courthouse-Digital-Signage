  # ── Announcements ─────────────────────────────────
  /api/announcements:
    get:
      tags: [Announcements]
      summary: List announcements
      description: |
        Public endpoint — unauthenticated requests always receive active-only announcements.
        With a valid JWT, the active query parameter controls filtering.
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
          description: |
            If true, only return enabled and non-expired announcements.
            Forced to true for unauthenticated requests.
        - name: displayId
          in: query
          schema:
            type: string
          description: |
            Filter to announcements visible on this display.
            Returns announcements with no display restriction (all displays)
            plus announcements explicitly assigned to this display ID.
      responses:
        '200':
          description: List of announcements
          content:
            application/json:
              schema:
                type: object
                properties:
                  announcements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
                  total:
                    type: integer
    post:
      tags: [Announcements]
      summary: Create an announcement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnnouncementRequest'
      responses:
        '201':
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '400':
          description: Missing required text
