  # ── System ────────────────────────────────────────
  /api/export:
    get:
      tags: [System]
      summary: Export all data as JSON (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON data export
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      docketEntries:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocketEntry'
                      displays:
                        type: array
                        items:
                          $ref: '#/components/schemas/Display'
                      announcements:
                        type: array
                        items:
                          $ref: '#/components/schemas/Announcement'
                      settings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Setting'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/clear:
    delete:
      tags: [System]
      summary: Clear all data except users (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Data cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  cleared:
                    type: object
                    properties:
                      docketEntries:
                        type: integer
                      announcements:
                        type: integer
                      auditLogs:
                        type: integer
                      displayDocketEntries:
                        type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/import:
    post:
      tags: [System]
      summary: Import data from JSON export (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Data object matching export format
      responses:
        '200':
          description: Data imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  imported:
                    type: object
        '400':
          description: Invalid import data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
