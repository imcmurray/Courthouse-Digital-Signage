openapi: 3.0.3
info:
  title: Courthouse Digital Signage API
  description: |
    REST API for the Courthouse Digital Signage System.
    Manages docket entries, display clients, announcements, users, and system settings
    for U.S. Bankruptcy Court digital signage displays.
  version: 1.0.0
  contact:
    name: Court IT

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Authentication and session management
  - name: Health
    description: System health and schema verification
  - name: Dashboard
    description: Dashboard statistics and recent activity
  - name: Docket
    description: Docket entry CRUD and related lookups
  - name: Displays
    description: Display client management and configuration
  - name: Announcements
    description: Ticker announcements
  - name: Users
    description: User account management (admin only)
  - name: API Keys
    description: API key management for display clients
  - name: Audit Logs
    description: Audit log viewing and export (admin only)
  - name: Settings
    description: System settings and logo management
  - name: Calendar Import
    description: Court calendar PDF import
  - name: System
    description: Data export, import, and clearing

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /api/auth/login
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Display client API key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
      required: [email, password, name]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        isActive:
          type: boolean
        password:
          type: string
          minLength: 8

    DocketEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseNumber:
          type: string
        caseTitle:
          type: string
        caseChapter:
          type: string
          description: Bankruptcy chapter (7, 11, 13)
        adversaryNumber:
          type: string
          nullable: true
        adversaryTitle:
          type: string
          nullable: true
        hearingDate:
          type: string
          format: date-time
        hearingTime:
          type: string
          description: 24hr format HH:MM
        hearingMatter:
          type: string
        hearingJudge:
          type: string
        courtroom:
          type: string
          nullable: true
        movingParty:
          type: string
          nullable: true
        opposingParty:
          type: string
          nullable: true
        trustee:
          type: string
          nullable: true
        isZoom:
          type: boolean
        zoomMeetingId:
          type: string
          nullable: true
        zoomPasscode:
          type: string
          nullable: true
        zoomPhone:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled, continued, stricken, reserved]
        statusNote:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdById:
          type: string
          nullable: true

    CreateDocketEntryRequest:
      type: object
      properties:
        caseNumber:
          type: string
        caseTitle:
          type: string
        caseChapter:
          type: string
        adversaryNumber:
          type: string
        adversaryTitle:
          type: string
        hearingDate:
          type: string
          format: date
        hearingTime:
          type: string
          description: 24hr format HH:MM
        hearingMatter:
          type: string
        hearingJudge:
          type: string
        courtroom:
          type: string
        movingParty:
          type: string
        opposingParty:
          type: string
        trustee:
          type: string
        isZoom:
          type: boolean
        zoomMeetingId:
          type: string
        zoomPasscode:
          type: string
        zoomPhone:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled, continued, stricken, reserved]
        statusNote:
          type: string
        comment:
          type: string
        displayIds:
          type: array
          items:
            type: string
          description: Display IDs to associate with this entry
      required: [caseNumber, caseTitle, caseChapter, hearingDate, hearingTime, hearingMatter, hearingJudge]

    DocketListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DocketEntry'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    BulkImportRequest:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CreateDocketEntryRequest'
          maxItems: 500
      required: [entries]

    BulkImportResponse:
      type: object
      properties:
        message:
          type: string
        count:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DocketEntry'

    Display:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        judgeFilter:
          type: string
          nullable: true
        courtroomFilter:
          type: string
          nullable: true
        chapterFilter:
          type: string
          nullable: true
          description: JSON array as string
        showStricken:
          type: boolean
        showZoomInfo:
          type: boolean
        highlightCurrent:
          type: boolean
        theme:
          type: string
        columns:
          type: string
          description: JSON array of column names
        showWeather:
          type: boolean
        weatherLocation:
          type: string
          nullable: true
        noticeText:
          type: string
        tickerEnabled:
          type: boolean
        tickerSpeed:
          type: string
          enum: [slow, medium, fast]
        status:
          type: string
          enum: [online, offline, unknown]
        lastHeartbeat:
          type: string
          format: date-time
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDisplayRequest:
      type: object
      properties:
        id:
          type: string
          description: Custom display ID (e.g. "display-321-main")
        name:
          type: string
        location:
          type: string
        judgeFilter:
          type: string
        courtroomFilter:
          type: string
        chapterFilter:
          type: string
        showStricken:
          type: boolean
        showZoomInfo:
          type: boolean
        highlightCurrent:
          type: boolean
        theme:
          type: string
        columns:
          type: string
        showWeather:
          type: boolean
        weatherLocation:
          type: string
        noticeText:
          type: string
        tickerEnabled:
          type: boolean
        tickerSpeed:
          type: string
          enum: [slow, medium, fast]
      required: [id, name, location]

    CreateDisplayResponse:
      type: object
      properties:
        display:
          $ref: '#/components/schemas/Display'
        apiKey:
          type: string
          description: Plain-text API key (only shown once at creation)

    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 500
        priority:
          type: integer
          description: Lower number = higher priority
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdById:
          type: string
          nullable: true

    CreateAnnouncementRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 500
        priority:
          type: integer
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
      required: [text]

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          description: First 8 chars of the key
        permissions:
          type: string
          description: JSON array of permission strings
        displayId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        displayId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [name]

    CreateApiKeyResponse:
      type: object
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: Plain-text API key (only shown once)

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true
        apiKeyId:
          type: string
          nullable: true
        changes:
          type: string
          nullable: true
          description: JSON string of changes
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Setting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          description: JSON-encoded value
        updatedAt:
          type: string
          format: date-time
        updatedById:
          type: string
          nullable: true

    ImportLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [pdf-auto, csv-manual]
        judgeName:
          type: string
          nullable: true
        judgeCode:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true
        entriesFound:
          type: integer
        entriesCreated:
          type: integer
        entriesUpdated:
          type: integer
        entriesSkipped:
          type: integer
        status:
          type: string
          enum: [running, success, partial, failed]
        errorMessage:
          type: string
          nullable: true
        durationMs:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          description: Server uptime in seconds

    StatsResponse:
      type: object
      properties:
        todaysHearings:
          type: integer
        activeDisplays:
          type: integer
        totalDisplays:
          type: integer
        activeAnnouncements:
          type: integer
        activeUsers:
          type: integer

    ActivityEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        user:
          type: string
        timestamp:
          type: string
          format: date-time
        changes:
          type: object
          nullable: true

paths:
  # ── Auth ──────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials or deactivated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (invalidate session client-side)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Health ────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Health check with database connectivity
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System degraded (database unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/schema-check:
    get:
      tags: [Health]
      summary: Verify database schema has all required tables
      responses:
        '200':
          description: Schema verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, warning, error]
                  tables:
                    type: array
                    items:
                      type: string
                  missingTables:
                    type: array
                    items:
                      type: string
                  extraTables:
                    type: array
                    items:
                      type: string

  # ── Dashboard ─────────────────────────────────────
  /api/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recent-activity:
    get:
      tags: [Dashboard]
      summary: Get recent audit activity for dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Number of entries to return
      responses:
        '200':
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityEntry'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Docket ────────────────────────────────────────
  /api/docket:
    get:
      tags: [Docket]
      summary: List docket entries with filtering and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by hearing date (YYYY-MM-DD)
        - name: courtroom
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, completed, cancelled, continued, stricken, reserved]
        - name: judge
          in: query
          schema:
            type: string
        - name: chapter
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search across case number, title, matter, and judge
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [hearingTime, hearingDate, caseNumber, caseTitle, status, courtroom, hearingJudge, caseChapter]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated docket entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocketListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Docket]
      summary: Create a single docket entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocketEntryRequest'
      responses:
        '201':
          description: Created docket entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocketEntry'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate entry (case number + date + time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/bulk:
    post:
      tags: [Docket]
      summary: Bulk import docket entries (max 500)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportRequest'
      responses:
        '201':
          description: Entries created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResponse'
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate entry found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/judges:
    get:
      tags: [Docket]
      summary: Get distinct judge names for autocomplete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of judge names
          content:
            application/json:
              schema:
                type: object
                properties:
                  judges:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/courtrooms:
    get:
      tags: [Docket]
      summary: Get distinct courtroom values for autocomplete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of courtrooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  courtrooms:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/trustees:
    get:
      tags: [Docket]
      summary: Get distinct trustee names for autocomplete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of trustees
          content:
            application/json:
              schema:
                type: object
                properties:
                  trustees:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/judge-zoom:
    get:
      tags: [Docket]
      summary: Get Zoom info for a judge's calendar
      security:
        - bearerAuth: []
      parameters:
        - name: judge
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Zoom meeting info
          content:
            application/json:
              schema:
                type: object
                properties:
                  isZoom:
                    type: boolean
                  zoomMeetingId:
                    type: string
                    nullable: true
                  zoomPasscode:
                    type: string
                    nullable: true
                  zoomPhone:
                    type: string
                    nullable: true
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/template:
    get:
      tags: [Docket]
      summary: Get CSV template for docket import
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV template file
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/{id}:
    get:
      tags: [Docket]
      summary: Get a single docket entry by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Docket entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocketEntry'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Docket]
      summary: Update a docket entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
