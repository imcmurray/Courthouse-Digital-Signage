                        name:
                          type: string
                        courtroom:
                          type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Calendar Import]
      summary: Update calendar import configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                judges:
                  type: array
                  items:
                    type: object
                    properties:
