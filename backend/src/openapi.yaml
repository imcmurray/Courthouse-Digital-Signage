openapi: 3.0.3
info:
  title: Courthouse Digital Signage API
  description: |
    REST API for the Courthouse Digital Signage System.
    Manages docket entries, display clients, announcements, users, and system settings
    for U.S. Bankruptcy Court digital signage displays.
  version: 1.0.0
  contact:
    name: Court IT

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Authentication and session management
  - name: Health
    description: System health and schema verification
  - name: Dashboard
    description: Dashboard statistics and recent activity
  - name: Docket
    description: Docket entry CRUD and related lookups. Mutating operations (POST, PUT, DELETE) require editor or admin role.
  - name: Displays
    description: Display client management and configuration. Mutating operations (POST, PUT, DELETE) require editor or admin role.
  - name: Announcements
    description: Ticker announcements. Mutating operations (POST, PUT, DELETE, PATCH) require editor or admin role.
  - name: Users
    description: User account management (admin only)
  - name: API Keys
    description: API key management for display clients
  - name: Audit Logs
    description: Audit log viewing and export (admin only)
  - name: Settings
    description: System settings and logo management
  - name: Calendar Import
    description: Court calendar PDF import
  - name: System
    description: Data export, import, and clearing
  - name: Idle Content Cards
    description: Idle content card management for display slideshows
  - name: News
    description: Court news article scraping and management
  - name: Display Templates
    description: Display layout template management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /api/auth/login
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Display client API key

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT access token (30 min)
        user:
          $ref: '#/components/schemas/UserSummary'
      description: |
        The refresh token is set as an HttpOnly cookie (refreshToken) scoped to /api/auth.
        It is not returned in the response body.

    RefreshRequest:
      type: object
      description: |
        The refresh token is read from the HttpOnly cookie set at login.
        A refreshToken in the body is accepted as a fallback for backward compatibility.
      properties:
        refreshToken:
          type: string
          description: Optional fallback — prefer cookie-based refresh

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'

    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
      required: [email, password, name]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        isActive:
          type: boolean
        password:
          type: string
          minLength: 8

    DocketEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseNumber:
          type: string
        caseTitle:
          type: string
        caseChapter:
          type: string
          description: Bankruptcy chapter (7, 11, 13)
        adversaryNumber:
          type: string
          nullable: true
        adversaryTitle:
          type: string
          nullable: true
        hearingDate:
          type: string
          format: date-time
          description: Stored as UTC midnight (e.g. 2026-02-10T00:00:00.000Z)
        hearingTime:
          type: string
          description: 24hr format HH:MM
        hearingMatter:
          type: string
        hearingJudge:
          type: string
        courtroom:
          type: string
          nullable: true
        movingParty:
          type: string
          nullable: true
        opposingParty:
          type: string
          nullable: true
        trustee:
          type: string
          nullable: true
        isZoom:
          type: boolean
        zoomMeetingId:
          type: string
          nullable: true
        zoomPasscode:
          type: string
          nullable: true
        zoomPhone:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled, continued, stricken, reserved]
        statusNote:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdById:
          type: string
          nullable: true

    CreateDocketEntryRequest:
      type: object
      properties:
        caseNumber:
          type: string
        caseTitle:
          type: string
        caseChapter:
          type: string
        adversaryNumber:
          type: string
        adversaryTitle:
          type: string
        hearingDate:
          type: string
          format: date
        hearingTime:
          type: string
          description: 24hr format HH:MM
        hearingMatter:
          type: string
        hearingJudge:
          type: string
        courtroom:
          type: string
        movingParty:
          type: string
        opposingParty:
          type: string
        trustee:
          type: string
        isZoom:
          type: boolean
        zoomMeetingId:
          type: string
        zoomPasscode:
          type: string
        zoomPhone:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled, continued, stricken, reserved]
        statusNote:
          type: string
        comment:
          type: string
        displayIds:
          type: array
          items:
            type: string
          description: Display IDs to associate with this entry
      required: [caseNumber, caseTitle, caseChapter, hearingDate, hearingTime, hearingMatter, hearingJudge]

    DocketListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DocketEntry'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    BulkImportRequest:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CreateDocketEntryRequest'
          maxItems: 500
      required: [entries]

    BulkImportResponse:
      type: object
      properties:
        message:
          type: string
        count:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DocketEntry'

    Display:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        judgeFilter:
          type: string
          nullable: true
        courtroomFilter:
          type: string
          nullable: true
        chapterFilter:
          type: string
          nullable: true
          description: JSON array as string
        showStricken:
          type: boolean
        showZoomInfo:
          type: boolean
        highlightCurrent:
          type: boolean
        orientation:
          type: string
          enum: [landscape, portrait]
        theme:
          type: string
        columns:
          type: string
          description: JSON array of column names
        showWeather:
          type: boolean
        weatherLocation:
          type: string
          nullable: true
        noticeText:
          type: string
        tickerEnabled:
          type: boolean
        tickerSpeed:
          type: string
          enum: [slow, medium, fast]
        scheduleEnabled:
          type: boolean
          description: Whether active hours schedule is enabled
        scheduleConfig:
          type: string
          description: JSON object with day-of-week schedule configuration
        screensaverType:
          type: string
          enum: [black, clock, logo]
          description: Screensaver style when display is outside active hours
        docketViewMode:
          type: string
          enum: [all, smart]
          default: all
          description: '"all" shows every hearing; "smart" filters by time relevance'
        displayType:
          type: string
          enum: [courtroom, combined, wayfinding, it-status, chambers]
          default: courtroom
        wayfindingConfig:
          type: string
          nullable: true
          description: JSON object with wayfinding layout configuration
        rtspUrl1:
          type: string
          nullable: true
        rtspUrl2:
          type: string
          nullable: true
        cameraLabel1:
          type: string
          nullable: true
        cameraLabel2:
          type: string
          nullable: true
        cameraRotateInterval:
          type: integer
          nullable: true
          description: Camera rotation interval in seconds
        cameraConfig:
          type: string
          nullable: true
          description: JSON object with advanced camera configuration
        status:
          type: string
          enum: [online, offline, unknown]
        lastHeartbeat:
          type: string
          format: date-time
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDisplayRequest:
      type: object
      properties:
        id:
          type: string
          description: Custom display ID (e.g. "display-321-main")
        name:
          type: string
        location:
          type: string
        judgeFilter:
          type: string
        courtroomFilter:
          type: string
        chapterFilter:
          type: string
        showStricken:
          type: boolean
        showZoomInfo:
          type: boolean
        highlightCurrent:
          type: boolean
        orientation:
          type: string
          enum: [landscape, portrait]
        theme:
          type: string
        columns:
          type: string
        showWeather:
          type: boolean
        weatherLocation:
          type: string
        noticeText:
          type: string
        tickerEnabled:
          type: boolean
        tickerSpeed:
          type: string
          enum: [slow, medium, fast]
        scheduleEnabled:
          type: boolean
        scheduleConfig:
          type: object
          description: Day-of-week schedule with start/end times
        screensaverType:
          type: string
          enum: [black, clock, logo]
        docketViewMode:
          type: string
          enum: [all, smart]
          default: all
        displayType:
          type: string
          enum: [courtroom, combined, wayfinding, it-status, chambers]
          default: courtroom
        wayfindingConfig:
          type: string
          description: JSON object with wayfinding layout configuration
        rtspUrl1:
          type: string
        rtspUrl2:
          type: string
        cameraLabel1:
          type: string
        cameraLabel2:
          type: string
        cameraRotateInterval:
          type: integer
          description: Camera rotation interval in seconds
        cameraConfig:
          type: string
          description: JSON object with advanced camera configuration
      required: [id, name, location]

    CreateDisplayResponse:
      type: object
      properties:
        display:
          $ref: '#/components/schemas/Display'
        apiKey:
          type: string
          description: Plain-text API key (only shown once at creation)

    DisplayConfig:
      type: object
      description: Display configuration as returned to display clients (includes merged global settings)
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        showWeather:
          type: boolean
        weatherLocation:
          type: string
        noticeText:
          type: string
        tickerEnabled:
          type: boolean
        tickerSpeed:
          type: string
          enum: [slow, medium, fast]
        orientation:
          type: string
          enum: [landscape, portrait]
        showStricken:
          type: boolean
        showZoomInfo:
          type: boolean
        highlightCurrent:
          type: boolean
        theme:
          type: string
        columns:
          type: array
          items:
            type: string
          description: Parsed array of column names
        scheduleEnabled:
          type: boolean
        scheduleConfig:
          type: object
          description: Parsed day-of-week schedule (keys are day names, values are {start, end} or null)
        screensaverType:
          type: string
          enum: [black, clock, logo]
        docketViewMode:
          type: string
          enum: [all, smart]
          default: all
          description: '"all" shows every hearing; "smart" filters by time relevance'
        displayType:
          type: string
          enum: [courtroom, combined, wayfinding, it-status, chambers]
        wayfindingConfig:
          type: object
          nullable: true
          description: Parsed wayfinding layout configuration
        cameraConfig:
          type: object
          nullable: true
          description: Parsed camera configuration (array of {name, url} objects)
        courtName:
          type: string
        courtSubtitle:
          type: string
        courthouseName:
          type: string
        chiefJudge:
          type: string
        clerkOfCourt:
          type: string
        timezone:
          type: string
        courtLogo:
          type: string
          nullable: true

    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 500
        priority:
          type: integer
          description: Higher number = higher priority (shown first on displays)
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdById:
          type: string
          nullable: true
        createdBy:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        displays:
          type: array
          description: Display assignments. Empty array = shows on all displays.
          items:
            $ref: '#/components/schemas/AnnouncementDisplay'

    AnnouncementDisplay:
      type: object
      properties:
        displayId:
          type: string
        announcementId:
          type: string
        display:
          type: object
          properties:
            id:
              type: string
            name:
              type: string

    CreateAnnouncementRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 500
        priority:
          type: integer
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        displayIds:
          type: array
          description: Display IDs to target. Omit or send empty array for all displays.
          items:
            type: string
      required: [text]

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          description: First 8 chars of the key
        permissions:
          type: string
          description: JSON array of permission strings
        displayId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        displayId:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [name]

    CreateApiKeyResponse:
      type: object
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        key:
          type: string
          description: Plain-text API key (only shown once)

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true
        apiKeyId:
          type: string
          nullable: true
        changes:
          type: string
          nullable: true
          description: JSON string of changes
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Setting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          description: JSON-encoded value
        updatedAt:
          type: string
          format: date-time
        updatedById:
          type: string
          nullable: true

    ImportLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum: [pdf-auto, csv-manual]
        judgeName:
          type: string
          nullable: true
        judgeCode:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true
        entriesFound:
          type: integer
        entriesCreated:
          type: integer
        entriesUpdated:
          type: integer
        entriesSkipped:
          type: integer
        entriesRemoved:
          type: integer
        status:
          type: string
          enum: [running, success, partial, failed]
        errorMessage:
          type: string
          nullable: true
        durationMs:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          description: Server uptime in seconds

    StatsResponse:
      type: object
      properties:
        todaysHearings:
          type: integer
          description: Count of all docket entries for today (UTC date range)
        activeDisplays:
          type: integer
        totalDisplays:
          type: integer
        activeAnnouncements:
          type: integer
        activeUsers:
          type: integer

    ActivityEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
        user:
          type: string
        timestamp:
          type: string
          format: date-time
        changes:
          type: object
          nullable: true

    IdleContentCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [info, upcoming_hearings, statistics]
        icon:
          type: string
          nullable: true
          description: Icon name (e.g. "phone", "clock", "gavel", "info")
        sortOrder:
          type: integer
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdById:
          type: string
          nullable: true
        createdBy:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        displays:
          type: array
          description: Display assignments. Empty array = shows on all displays.
          items:
            type: object
            properties:
              displayId:
                type: string
              idleContentCardId:
                type: string
              display:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string

    CreateIdleContentCardRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        icon:
          type: string
          description: Icon name (e.g. "phone", "clock", "gavel", "info")
        sortOrder:
          type: integer
          default: 100
        enabled:
          type: boolean
          default: true
        expiresAt:
          type: string
          format: date-time
        displayIds:
          type: array
          description: Display IDs to target. Omit or send empty array for all displays.
          items:
            type: string
      required: [title, body]

    UpdateIdleContentCardRequest:
      type: object
      description: |
        For system cards (type != "info"), only enabled, sortOrder, and displayIds are accepted.
        For info cards, all fields can be updated.
      properties:
        title:
          type: string
        body:
          type: string
        icon:
          type: string
          nullable: true
        sortOrder:
          type: integer
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        displayIds:
          type: array
          items:
            type: string

    NewsArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
          description: Truncated summary (~200 chars)
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
          nullable: true
        fetchedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DisplayTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Unique slug (lowercase letters, numbers, hyphens)
        name:
          type: string
        description:
          type: string
          nullable: true
        isBuiltIn:
          type: boolean
        components:
          type: string
          description: JSON-stringified array of component configurations
        layout:
          type: string
          nullable: true
          description: JSON-stringified layout definition
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdById:
          type: string
          nullable: true
        createdBy:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
        usageCount:
          type: integer
          description: Number of displays using this template

    CreateDisplayTemplateRequest:
      type: object
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        name:
          type: string
        description:
          type: string
        components:
          description: Array of component configs (or JSON string)
          oneOf:
            - type: array
              items:
                type: object
            - type: string
        layout:
          description: Layout definition (or JSON string)
          oneOf:
            - type: object
            - type: string
      required: [slug, name, components]

    IdleContentResponse:
      type: object
      properties:
        enabled:
          type: boolean
        rotationInterval:
          type: integer
          description: Rotation interval in milliseconds
        modules:
          type: object
          properties:
            upcoming_hearings:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  nullable: true
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/DocketEntry'
            info_cards:
              type: object
              properties:
                cards:
                  type: array
                  items:
                    $ref: '#/components/schemas/IdleContentCard'
            news:
              type: object
              properties:
                articles:
                  type: array
                  items:
                    $ref: '#/components/schemas/NewsArticle'
            statistics:
              type: object
              properties:
                stats:
                  type: object
                  properties:
                    hearingsNext30:
                      type: integer
                    hearingsNext7:
                      type: integer
                    casesNext30:
                      type: integer
                      description: Distinct case count
                    judgesActive:
                      type: integer
                      description: Distinct judge count
                    nextHearingDate:
                      type: string
                      format: date
                      nullable: true

    SystemStatusResponse:
      type: object
      properties:
        health:
          type: object
          properties:
            status:
              type: string
              enum: [ok, degraded]
            database:
              type: string
              enum: [connected, disconnected]
            uptime:
              type: number
              description: Server uptime in seconds
        displays:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              location:
                type: string
                nullable: true
              displayType:
                type: string
              status:
                type: string
                enum: [online, offline]
              lastHeartbeat:
                type: string
                format: date-time
                nullable: true
        calendarSync:
          type: object
          properties:
            lastRunAt:
              type: string
              format: date-time
              nullable: true
            lastRunStatus:
              type: string
              nullable: true
            autoImportEnabled:
              type: boolean
            intervalMinutes:
              type: integer

paths:
  # ── Auth ──────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: |
        Returns an access token in the response body and sets the refresh token
        as an HttpOnly, Secure, SameSite=Strict cookie scoped to /api/auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials or deactivated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out and clear refresh token cookie
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using HttpOnly cookie
      description: |
        Reads the refresh token from the HttpOnly cookie set at login.
        Falls back to reading refreshToken from the request body for backward compatibility.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Health ────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Health check with database connectivity
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System degraded (database unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/schema-check:
    get:
      tags: [Health]
      summary: Verify database schema has all required tables (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Schema verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, warning, error]
                  tables:
                    type: array
                    items:
                      type: string
                  missingTables:
                    type: array
                    items:
                      type: string
                  extraTables:
                    type: array
                    items:
                      type: string

  # ── Dashboard ─────────────────────────────────────
  /api/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      description: |
        Returns aggregate counts for the dashboard. Hearing counts use UTC date
        boundaries to match the UTC-midnight storage format of hearingDate.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recent-activity:
    get:
      tags: [Dashboard]
      summary: Get recent audit activity for dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Number of entries to return
      responses:
        '200':
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityEntry'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Docket ────────────────────────────────────────
  /api/docket:
    get:
      tags: [Docket]
      summary: List docket entries with filtering and pagination
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by hearing date (YYYY-MM-DD). Compared against UTC date boundaries since hearingDate is stored as UTC midnight.
        - name: courtroom
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, completed, cancelled, continued, stricken, reserved]
        - name: judge
          in: query
          schema:
            type: string
        - name: chapter
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
          description: Search across case number, title, matter, and judge
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [hearingTime, hearingDate, caseNumber, caseTitle, status, courtroom, hearingJudge, caseChapter, hearingMatter]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: hidePast
          in: query
          description: When 'true', excludes entries whose hearing date+time have already passed. Uses UTC date boundaries.
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Paginated docket entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocketListResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Docket]
      summary: Create a single docket entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocketEntryRequest'
      responses:
        '201':
          description: Created docket entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocketEntry'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate entry (case number + date + time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/bulk:
    post:
      tags: [Docket]
      summary: Bulk import docket entries (max 500)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportRequest'
      responses:
        '201':
          description: Entries created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResponse'
        '400':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate entry found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/judges:
    get:
      tags: [Docket]
      summary: Get distinct judge names for autocomplete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of judge names
          content:
            application/json:
              schema:
                type: object
                properties:
                  judges:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/courtrooms:
    get:
      tags: [Docket]
      summary: Get distinct courtroom values for autocomplete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of courtrooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  courtrooms:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/trustees:
    get:
      tags: [Docket]
      summary: Get distinct trustee names for autocomplete
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of trustees
          content:
            application/json:
              schema:
                type: object
                properties:
                  trustees:
                    type: array
                    items:
                      type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/dates:
    get:
      tags: [Docket]
      summary: Get distinct hearing dates for calendar highlights
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of distinct hearing dates (YYYY-MM-DD)
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates:
                    type: array
                    items:
                      type: string
                      format: date
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/judge-zoom:
    get:
      tags: [Docket]
      summary: Get Zoom info for a judge's calendar
      security:
        - bearerAuth: []
      parameters:
        - name: judge
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Zoom meeting info
          content:
            application/json:
              schema:
                type: object
                properties:
                  isZoom:
                    type: boolean
                  zoomMeetingId:
                    type: string
                    nullable: true
                  zoomPasscode:
                    type: string
                    nullable: true
                  zoomPhone:
                    type: string
                    nullable: true
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/template:
    get:
      tags: [Docket]
      summary: Get CSV template for docket import
      security:
        - bearerAuth: []
      responses:
        '200':
          description: CSV template file
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/{id}:
    get:
      tags: [Docket]
      summary: Get a single docket entry by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Docket entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocketEntry'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Docket]
      summary: Update a docket entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocketEntryRequest'
      responses:
        '200':
          description: Updated docket entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocketEntry'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate entry conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Docket]
      summary: Delete a docket entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entry deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/docket/clear:
    delete:
      tags: [Docket]
      summary: Clear docket entries by date range or all
      description: Date parameters are compared against UTC date boundaries to match the UTC-midnight storage format of hearingDate.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Clear entries for a specific date (YYYY-MM-DD, matched as UTC)
        - name: before
          in: query
          schema:
            type: string
            format: date
          description: Clear entries before this date
      responses:
        '200':
          description: Entries cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Displays ──────────────────────────────────────
  /api/displays:
    get:
      tags: [Displays]
      summary: List all displays
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of displays
          content:
            application/json:
              schema:
                type: object
                properties:
                  displays:
                    type: array
                    items:
                      $ref: '#/components/schemas/Display'
                  total:
                    type: integer
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Displays]
      summary: Create a new display and generate its API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisplayRequest'
      responses:
        '201':
          description: Display created with API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDisplayResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Editor or admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Display ID already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/{id}:
    put:
      tags: [Displays]
      summary: Update a display's configuration
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisplayRequest'
      responses:
        '200':
          description: Updated display
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Displays]
      summary: Delete a display
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Display deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/{id}/regenerate-key:
    post:
      tags: [Displays]
      summary: Regenerate API key for a display
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    description: New plain-text API key (shown once)
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/{id}/preview-token:
    post:
      tags: [Displays]
      summary: Generate ephemeral preview token for a display
      description: Creates a short-lived token (5 min TTL) that can be used to preview the display without the real API key. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Preview token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  previewToken:
                    type: string
                    description: Ephemeral token to use as X-API-Key for preview
                  displayId:
                    type: string
                  expiresIn:
                    type: integer
                    description: Token TTL in seconds
                    example: 300
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/{id}/config:
    get:
      tags: [Displays]
      summary: Get display configuration (for display clients)
      description: Used by display clients to fetch their configuration. Authenticated via API key.
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Display configuration with merged global settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisplayConfig'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/{id}/docket:
    get:
      tags: [Displays]
      summary: Get docket entries for a specific display
      description: Returns docket entries filtered by the display's configuration. Authenticated via API key.
      security:
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Docket entries for the display
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocketEntry'
                  total:
                    type: integer
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/refresh:
    post:
      tags: [Displays]
      summary: Trigger all displays to refresh via WebSocket
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Refresh signal sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/{id}/screensaver:
    post:
      tags: [Displays]
      summary: Manual screensaver control (activate/deactivate)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [activate, deactivate]
              required: [action]
      responses:
        '200':
          description: Screensaver signal sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/displays/{id}/schedule:
    get:
      tags: [Displays]
      summary: Get display schedule (API key auth, for Pi companion script)
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Display schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  displayId:
                    type: string
                  scheduleEnabled:
                    type: boolean
                  scheduleConfig:
                    type: object
                    description: Day-of-week schedule with start/end times or null
                  screensaverType:
                    type: string
                    enum: [black, clock, logo]
                  timezone:
                    type: string
        '404':
          description: Display not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/display-docket-entries:
    get:
      tags: [Displays]
      summary: Get display-to-docket entry associations
      security:
        - bearerAuth: []
      parameters:
        - name: displayId
          in: query
          schema:
            type: string
        - name: docketEntryId
          in: query
          schema:
            type: string
      responses:
        '200':
