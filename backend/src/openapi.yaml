  # ── Calendar Import ───────────────────────────────
  /api/calendar-import/status:
    get:
      tags: [Calendar Import]
      summary: Get current import status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Import status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isRunning:
                    type: boolean
                  lastRun:
                    $ref: '#/components/schemas/ImportLog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar-import/run:
    post:
      tags: [Calendar Import]
      summary: Trigger a calendar import from court PDFs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Import started or completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportLog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Import already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar-import/history:
    get:
      tags: [Calendar Import]
      summary: Get import history
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Import history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportLog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/calendar-import/history/{id}:
    get:
      tags: [Calendar Import]
      summary: Get details of a specific import run
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Import details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportLog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Import not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

